name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        elif [ -f "ci/bitchard-release.jks" ]; then
          echo "Using persistent repository release signing keystore..."
          cp ci/bitchard-release.jks bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchard123"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchard123"
          } > keystore.properties
        else
          echo "Generating valid release signing keystore on runner..."
          keytool -genkeypair -v -keystore bitchord-release.jks -alias bitchord -keyalg RSA -keysize 2048 -validity 10000 -storepass bitchard123 -keypass bitchard123 -dname "CN=BitChard, OU=BitChard, O=BitChard, L=Paris, ST=IDF, C=FR"
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchard123"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchard123"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | head -n 1 | cut -d'"' -f4)
        BETA=$(grep 'extra\["bitchordBetaSuffix"\]' build.gradle.kts | head -n 1 | cut -d'"' -f4)
        if [ -n "$BETA" ]; then
          FULL_VERSION="${VERSION}-${BETA}"
        else
          FULL_VERSION="${VERSION}"
        fi
        echo "Extracted version: '${FULL_VERSION}'"
        echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT

    - name: Build Signed Prod Release APK
      run: ./gradlew :app:assembleProdRelease :wearos:assembleProdRelease

    - name: Prepare Release APKs
      run: |
        mkdir -p release-apks
        for f in app/build/outputs/apk/prod/release/*.apk; do
          [ -e "$f" ] || continue
          fname=$(basename "$f")
          cp "$f" "release-apks/$fname"
          case "$fname" in
            *universal*) cp "$f" "release-apks/BitChard-universal.apk" ;;
            *arm64-v8a*) cp "$f" "release-apks/BitChard-arm64-v8a.apk" ;;
            *armeabi-v7a*) cp "$f" "release-apks/BitChard-armeabi-v7a.apk" ;;
            *x86_64*) cp "$f" "release-apks/BitChard-x86_64.apk" ;;
          esac
        done
        for f in wearos/build/outputs/apk/prod/release/*.apk; do
          [ -e "$f" ] || continue
          cp "$f" "release-apks/$(basename "$f")"
        done
        ls -la release-apks/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchard-prod-release-signed
        path: release-apks/*.apk

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ steps.get_version.outputs.version }}"
        echo "Publishing release for $TAG..."
        
        # Create or update the versioned release and mark it latest
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Updating existing release $TAG..."
          gh release upload "$TAG" release-apks/*.apk --clobber
        else
          echo "Creating new release $TAG..."
          gh release create "$TAG" release-apks/*.apk \
            --title "BitChard $TAG" \
            --generate-notes \
            --latest
        fi

        # Also update latest release tag assets if it exists
        if gh release view "latest" >/dev/null 2>&1; then
          echo "Updating latest release assets..."
          gh release upload "latest" release-apks/*.apk --clobber || true
        fi

        # Trigger desktop PC release workflow
        echo "Triggering PC release workflow for ${{ steps.get_version.outputs.version }}..."
        gh workflow run release.yml -f version="${{ steps.get_version.outputs.version }}" || true


